name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Build the distribution package
        run: bash bin/make-dist.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="target/influxdb2tsfile-${VERSION}.jar"
          TARBALL="dist/influxdb2tsfile-${VERSION}-bin.tar.gz"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists, uploading assets with --clobber"
            gh release upload "${GITHUB_REF_NAME}" "${JAR}" "${TARBALL}" --clobber --repo "${GITHUB_REPOSITORY}"
          elif [ -f "${NOTES}" ]; then
            gh release create "${GITHUB_REF_NAME}" "${JAR}" "${TARBALL}" \
              --repo "${GITHUB_REPOSITORY}" --title "influxdb2tsfile ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" "${JAR}" "${TARBALL}" \
              --repo "${GITHUB_REPOSITORY}" --title "influxdb2tsfile ${VERSION}" --generate-notes
          fi

      - name: Verify the published assets (download them back and run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WORK="$(mktemp -d)"
          cd "${WORK}"
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --dir .
          echo '--- assets downloaded from the release ---'
          ls -la
          tar xzf "influxdb2tsfile-${VERSION}-bin.tar.gz"
          cd "influxdb2tsfile-${VERSION}"
          echo '--- launcher and jar from the downloaded package ---'
          bin/influxdb2tsfile --version
          java -jar "lib/influxdb2tsfile-${VERSION}.jar" --version
          printf 'release_check,host=a value=1.5,count=3i 1700000000000000000\nrelease_check,host=b value=2.5 1700000000000000000\n' > demo.lp
          bin/influxdb2tsfile lp2tsfile demo.lp -o ./out
          bin/influxdb2tsfile inspect ./out --manifest ./out/manifest.json
