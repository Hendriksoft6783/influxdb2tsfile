name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

      - name: Build the distribution package
        run: bash bin/make-dist.sh "${GITHUB_REF_NAME#v}"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          JAR="target/influxdb2tsfile-${VERSION}.jar"
          TARBALL="dist/influxdb2tsfile-${VERSION}-bin.tar.gz"
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "${NOTES}" ]; then
            gh release create "${GITHUB_REF_NAME}" "${JAR}" "${TARBALL}" \
              --title "influxdb2tsfile ${VERSION}" --notes-file "${NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" "${JAR}" "${TARBALL}" \
              --title "influxdb2tsfile ${VERSION}" --generate-notes
          fi
