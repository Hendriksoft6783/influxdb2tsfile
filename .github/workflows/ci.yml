name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21', '25' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Show toolchain
        run: |
          java -version
          mvn -version

      - name: Run tests
        run: mvn -B -ntp clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Package the fat-jar
        if: matrix.java == '17'
        run: mvn -B -ntp -DskipTests package

      - name: Smoke test the jar
        if: matrix.java == '17'
        run: |
          java -jar target/influxdb2tsfile-*.jar --version
          java -jar target/influxdb2tsfile-*.jar --help

      - name: Upload the fat-jar
        if: matrix.java == '17'
        uses: actions/upload-artifact@v7
        with:
          name: influxdb2tsfile-fatjar
          path: target/influxdb2tsfile-*.jar
          if-no-files-found: error